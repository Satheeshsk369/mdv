<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style id="palette"></style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16.5px/1.65 Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: auto 1fr; overflow: hidden; scrollbar-color: var(--muted) var(--deep); }
  code, pre, kbd, .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  header { display: flex; align-items: center; gap: .6em; padding: .35em .8em; background: var(--panel); border-bottom: 1px solid var(--faint); font-size: 14px; }
  header .badge { color: var(--cyan); font-weight: bold; }
  header .name { color: var(--text); font-weight: bold; }
  header .spacer { flex: 1; }
  header .hint { color: var(--muted); }
  main { display: flex; min-height: 0; }
  nav { flex: 0 0 17em; overflow: auto; border-right: 1px solid var(--faint); padding: .8em 0; font-size: 14px; display: none; }
  body.toc nav { display: block; }
  nav a { display: block; padding: .15em .9em; color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav a:hover { color: var(--text); }
  nav a.active { color: var(--green); background: var(--row); font-weight: bold; }
  article { flex: 1 1 0; min-width: 0; min-height: 0; overflow-y: scroll; padding: 1.5em 10%; outline: none; }
  h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.4em 0 .5em; }
  h1 { color: var(--red); font-size: 1.9em; } h2 { color: var(--green); font-size: 1.5em; } h3 { color: var(--orange); font-size: 1.25em; }
  h4 { color: var(--yellow); } h5 { color: var(--purple); } h6 { color: var(--cyan); }
  a { color: var(--cyan); }
  p { margin: .6em 0; }
  code { background: var(--panel); color: var(--cyan); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
  pre { background: var(--panel); padding: .9em 1.1em; border-radius: 6px; overflow: auto; line-height: 1.4; }
  pre code { background: none; padding: 0; color: var(--text); font-size: 14px; }
  pre.math { background: none; color: var(--text); font-size: 15px; line-height: 1.2; }
  span.math { color: var(--text); font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif; font-size: 1.05em; }
  del { color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--muted); margin: 1.4em 0; }
  blockquote { margin: .8em 0; padding: .2em 1em; border-left: 3px solid var(--muted); color: var(--text); background: var(--deep); border-radius: 0 6px 6px 0; }
  .callout .title { font-weight: bold; margin: .4em 0; }
  .callout.note { border-color: var(--cyan); } .callout.note .title { color: var(--cyan); }
  .callout.tip { border-color: var(--green); } .callout.tip .title { color: var(--green); }
  .callout.warning { border-color: var(--orange); } .callout.warning .title { color: var(--orange); }
  .callout.important { border-color: var(--purple); } .callout.important .title { color: var(--purple); }
  .callout.caution { border-color: var(--red); } .callout.caution .title { color: var(--red); }
  .item { display: flex; gap: .5em; margin: .15em 0 .15em calc(var(--depth) * .6em); }
  .item .marker { color: var(--cyan); min-width: 1.2em; }
  table { border-collapse: collapse; margin: .8em 0; }
  th { color: var(--cyan); border-bottom: 1px solid var(--muted); }
  th, td { padding: .3em .9em; }
  tr:nth-child(even) td { background: var(--deep); }
  .footnote { color: var(--muted); font-size: .9em; }
  dl.front { display: grid; grid-template-columns: auto 1fr; gap: .2em 1em; padding-bottom: .8em; border-bottom: 1px solid var(--muted); }
  dl.front dt { color: var(--cyan); font-weight: bold; } dl.front dd { margin: 0; }
  img { max-width: 100%; }
  .lit { background: var(--focus); border-radius: 4px; }
  .overlay { position: fixed; inset: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 10vh; background: rgba(0, 0, 0, .45); }
  .overlay.open { display: flex; }
  .panel { background: var(--panel); border: 1px solid var(--faint); border-radius: 8px; min-width: 24em; max-height: 75vh; overflow: auto; padding: .5em 0; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
  .panel h3 { margin: .3em 1em .5em; color: var(--orange); font-size: 1em; }
  .panel .row { display: flex; justify-content: space-between; gap: 2em; padding: .25em 1em; cursor: pointer; }
  .panel .row.active { background: var(--row); color: var(--green); font-weight: bold; }
  .panel .row kbd { color: var(--muted); font-size: .85em; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .6); font-size: 1.4em; }
</style>
</head>
<body>
<header>
  <span class="badge">mdv</span><span class="name" id="name">README.md</span>
  <span class="spacer"></span>
  <span class="hint">Space options</span>
</header>
<main>
  <nav id="toc"></nav>
  <article id="view"></article>
</main>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<div id="drop">Drop a Markdown file</div>
<input id="file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden>
<script>
const WASM = `
__WASM__
`;
const DOC = `
__DOC__
`;

const bytes = s => Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0));
const encoder = new TextEncoder();
const decoder = new TextDecoder();
const $ = id => document.getElementById(id);
const view = $('view'), toc = $('toc');
let ex, name = 'README.md', text = '', theme = 0, heading = 0, lit = false;

function put(value) {
  const data = encoder.encode(value);
  const at = ex.mdv_alloc(data.length);
  new Uint8Array(ex.memory.buffer, at, data.length).set(data);
  return [at, data.length];
}
const read = at => decoder.decode(new Uint8Array(ex.memory.buffer, at, ex.mdv_length()));

function render() {
  const [at, length] = put(text);
  view.innerHTML = read(ex.mdv_html(at, length));
  outline();
  if (lit) highlight();
}

const headings = () => [...view.querySelectorAll('h1,h2,h3,h4,h5,h6')];

function outline() {
  toc.innerHTML = '';
  headings().forEach((h, i) => {
    const link = document.createElement('a');
    link.textContent = h.textContent;
    link.href = '#' + h.id;
    link.style.paddingLeft = (Number(h.tagName[1]) - 1) * 0.9 + 0.9 + 'em';
    link.onclick = event => { event.preventDefault(); go(i); };
    toc.appendChild(link);
  });
}

let speed = 1;
const velocity = event => speed = event.repeat ? Math.min(speed + 1, 8) : 1;

function move(at, count, event, page) {
  const last = Math.max(count - 1, 0);
  const step = event.key === 'ArrowDown' || event.key === 'ArrowUp' ? velocity(event) : 1;
  return { ArrowDown: Math.min(at + step, last), ArrowUp: Math.max(at - step, 0), PageDown: Math.min(at + page, last), PageUp: Math.max(at - page, 0), Home: 0, End: last }[event.key];
}

const tocOpen = () => document.body.classList.contains('toc');

function openToc() {
  const top = view.getBoundingClientRect().top + 20;
  heading = 0;
  headings().forEach((h, i) => { if (h.getBoundingClientRect().top <= top) heading = i; });
  document.body.classList.add('toc');
  select();
}

function select() {
  [...toc.children].forEach((a, i) => a.classList.toggle('active', i === heading));
  toc.children[heading]?.scrollIntoView({ block: 'nearest' });
}

function closeToc() { document.body.classList.remove('toc'); }

function go(i) {
  closeToc();
  headings()[i]?.scrollIntoView({ block: 'start' });
}

const line = () => parseFloat(getComputedStyle(view).lineHeight) || 27;
const SCROLL = {
  ArrowDown: event => line() * velocity(event), ArrowUp: event => -line() * velocity(event),
  PageDown: () => view.clientHeight / 2, PageUp: () => -view.clientHeight / 2,
  Home: () => -view.scrollHeight, End: () => view.scrollHeight,
};

view.addEventListener('scroll', () => { if (lit) highlight(); });

function highlight() {
  for (const e of view.querySelectorAll('.lit')) e.classList.remove('lit');
  if (!lit) return;
  const top = view.getBoundingClientRect().top + view.clientHeight / 3;
  let best = null;
  for (const e of view.children) if (e.getBoundingClientRect().top <= top) best = e;
  (best || view.firstElementChild)?.classList.add('lit');
}

function paint(index, keep = true) {
  theme = index;
  $('palette').textContent = read(ex.mdv_theme_css(index));
  if (keep) localStorage.setItem('mdv:theme', String(index));
}

function themes() { return Array.from({ length: ex.mdv_themes() }, (_, i) => read(ex.mdv_theme_name(i))); }

let picker = null;
function list(title, rows, chosen, { preview, pick, cancel }) {
  const panel = $('panel');
  let at = chosen;
  const draw = () => {
    panel.innerHTML = `<h3>${title}</h3>` + rows.map((r, i) => `<div class="row${i === at ? ' active' : ''}" data-i="${i}"><span>${r[0]}</span><kbd>${r[1] || ''}</kbd></div>`).join('');
    panel.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
  };
  picker = {
    key(event) {
      const next = move(at, rows.length, event, 5);
      if (next !== undefined) { at = next; draw(); preview?.(at); }
      else if (event.key === 'Enter' || event.key === 'ArrowRight') { close(); pick(at); }
      else if (event.key === 'Escape' || event.key === 'ArrowLeft' || event.key === ' ') { close(); cancel?.(); }
      else return false;
      return true;
    },
  };
  panel.onclick = event => { const row = event.target.closest('.row'); if (row) { close(); pick(Number(row.dataset.i)); } };
  draw();
  $('overlay').classList.add('open');
}
function close() { picker = null; $('overlay').classList.remove('open'); }
$('overlay').onclick = event => { if (event.target.id === 'overlay') close(); };

function chooseTheme() {
  const original = theme;
  list('Theme', themes().map(t => [t, '']), theme, { preview: paint, pick: i => paint(i), cancel: () => paint(original) });
}

const ACTIONS = [
  ['Outline', 'Tab', openToc],
  ['Highlight block', 'h', () => { lit = !lit; highlight(); }],
  ['Theme', 'c', chooseTheme],
  ['Open file', 'o', () => $('file').click()],
  ['Copy document', 'y', () => navigator.clipboard?.writeText(text)],
];

document.addEventListener('keydown', event => {
  if (picker) { if (picker.key(event)) event.preventDefault(); return; }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (tocOpen()) {
    const next = move(heading, toc.children.length, event, 10);
    if (next !== undefined) { heading = next; select(); }
    else if (event.key === 'Enter' || event.key === 'ArrowRight') go(heading);
    else if (['Escape', 'ArrowLeft', 'Tab', 't'].includes(event.key)) closeToc();
    else return;
    event.preventDefault();
    return;
  }
  if (SCROLL[event.key]) { event.preventDefault(); view.scrollBy({ top: SCROLL[event.key](event), behavior: 'instant' }); return; }
  const keys = { ' ': () => list('Options', ACTIONS.map(a => [a[0], a[1]]), 0, { pick: i => ACTIONS[i][2]() }),
    'Tab': openToc, 't': openToc, 'h': () => { lit = !lit; highlight(); }, 'c': chooseTheme,
    'o': () => $('file').click(), 'y': () => navigator.clipboard?.writeText(text), 'Escape': () => { lit = false; highlight(); } };
  const action = keys[event.key];
  if (action) { event.preventDefault(); action(); }
});

function open(file) {
  file.text().then(value => {
    name = file.name;
    $('name').textContent = name;
    text = value;
    render();
    view.scrollTo(0, 0);
  });
}
$('file').addEventListener('change', event => { if (event.target.files[0]) open(event.target.files[0]); });
window.addEventListener('dragover', event => { event.preventDefault(); $('drop').style.display = 'flex'; });
window.addEventListener('dragleave', () => { $('drop').style.display = 'none'; });
window.addEventListener('drop', event => { event.preventDefault(); $('drop').style.display = 'none'; if (event.dataTransfer.files[0]) open(event.dataTransfer.files[0]); });

(async () => {
  const { instance } = await WebAssembly.instantiate(bytes(WASM), { env: new Proxy({}, { get: () => () => 0, has: () => true }) });
  ex = instance.exports;
  ex._initialize();
  paint(Number(localStorage.getItem('mdv:theme') || 0), false);
  text = decoder.decode(bytes(DOC));
  render();
  view.tabIndex = 0;
  view.focus();
})();
</script>
</body>
</html>
