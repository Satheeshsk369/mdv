name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, c3: c3-linux-static.tar.gz, unpack: tar xzf, flags: "" }
          - { name: macos-arm64, os: macos-latest, c3: c3-macos.zip, unpack: unzip -q, flags: "" }
          - { name: macos-x64, os: macos-latest, c3: c3-macos.zip, unpack: unzip -q, flags: "--target macos-x64 --macos-sdk $(xcrun --show-sdk-path)" }
          - { name: windows-x64, os: windows-latest, c3: c3-windows.zip, unpack: 7z x -y, flags: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: c3c
        working-directory: ${{ runner.temp }}
        run: |
          curl -sLO https://github.com/c3lang/c3c/releases/download/v0.8.5/${{ matrix.c3 }}
          ${{ matrix.unpack }} ${{ matrix.c3 }}
          echo "${{ runner.temp }}/c3" >> "$GITHUB_PATH"
      - name: build
        run: c3c build mdv ${{ matrix.flags }}
      - name: test
        if: matrix.flags == ''
        run: |
          c3c test
          printf '# mdv\n\n$x^2$\n' | ./build/mdv -p
      - name: package
        run: |
          if [ -f build/mdv.exe ]; then 7z a mdv-${{ matrix.name }}.zip ./build/mdv.exe; else tar czf mdv-${{ matrix.name }}.tar.gz -C build mdv; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: mdv-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$(jq -r .version project.json)
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/* --target "${{ github.sha }}" --title "$tag" --generate-notes
